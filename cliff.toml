# git-cliff configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""

body = """
{% if version %}
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | trim }}
{% endfor %}
{% endfor %}
"""

footer = """
---
Generated by git-cliff
"""

trim = true

[git]
# Only include commits that follow Conventional Commits
conventional_commits = true
filter_unconventional = true

# Don’t include these commits in the changelog
ignore_commits = [
  "^chore\\(release\\):",
  "^Merge branch"
]

# Tag settings
tag_pattern = "v[0-9]*"
skip_tags = false

# Sort commits newest → oldest
sort_commits = "newest"

[commit_parsers]
# Features
[[commit_parsers]]
message = "^feat"
group = "✨ Features"

# Bug fixes
[[commit_parsers]]
message = "^fix"
group = "🐛 Bug Fixes"

# Documentation
[[commit_parsers]]
message = "^docs"
group = "📚 Documentation"

# Performance
[[commit_parsers]]
message = "^perf"
group = "⚡ Performance"

# Refactors
[[commit_parsers]]
message = "^refactor"
group = "🧹 Refactoring"

# Tests
[[commit_parsers]]
message = "^te
